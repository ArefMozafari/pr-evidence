name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so this names the exact release.
      - uses: astral-sh/setup-uv@v10.2.0

      # The reference validator from the Agent Skills spec rejects any frontmatter key other
      # agents would not accept, so a skill that passes here loads everywhere.
      - name: Validate the skill against the Agent Skills spec
        run: uvx --from skills-ref==0.1.1 agentskills validate skills/pr-evidence

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate the Claude Code marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2 plugin validate --strict .claude-plugin/marketplace.json
          npx --yes @anthropic-ai/claude-code@2 plugin validate --strict .claude-plugin/plugin.json

      # Gemini CLI ships no offline validator, so this checks the fields its extension loader reads.
      - name: Validate the Gemini CLI extension manifest
        run: jq -e '.name == "pr-evidence" and (.version | type == "string") and (.description | type == "string")' gemini-extension.json
